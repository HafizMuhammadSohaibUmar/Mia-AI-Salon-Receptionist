services:
  mia:
    build: .
    restart: unless-stopped
    env_file: .env
    networks:
      - frappe_docker_default
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      traefik.enable: "true"
      traefik.docker.network: frappe_docker_default
      traefik.http.routers.mia.entrypoints: websecure
      traefik.http.routers.mia.rule: Host(`mia-ai-salon-receptionist.sohaib.systems`)
      traefik.http.routers.mia.tls.certresolver: main-resolver
      traefik.http.services.mia.loadbalancer.server.port: "8007"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  frappe_docker_default:
    external: true
